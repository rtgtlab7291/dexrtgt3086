[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robokit"
version = "0.1.0"
authors = [{ name = "RoboKit Organization" }]
description = "RoboKit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typing-extensions",
    "jaxtyping",
    "rich",
    "PyYAML",
    "numpy",
    "yourdfpy",
    "viser",
    "warp-lang",
    "huggingface-hub",
    "trimesh",
]


[project.optional-dependencies]
pt-cpu = ["torch"]
pt-cu118 = ["torch"]
pt-cu126 = ["torch; python_version >= '3.9'"]
pt-cu128 = ["torch; python_version >= '3.9'", "nvidia-nccl-cu12; python_version >= '3.9'"]
warp-1-8 = ["warp-lang>=1.8.0,<1.9"]
warp-1-10 = ["warp-lang>=1.10.0,<1.11"]
dr = [
    "nvdiffrast",
    "setuptools",
]
hand-vector-bench = [
    "dex-retargeting",
    "jax[cuda12]>=0.6.2; python_version >= '3.10'",
    "loguru",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@d139cbec229a22d9d1232e0b26fdbc0ac66c90f2 ; python_version >= '3.10'",
    "scipy",
    "setuptools<81",
    "torch",
    "tqdm",
    "tyro>=0.9.0",
]

# MJCF (MuJoCo XML) parsing. ``RobotSpec.parse_mjcf`` lazily imports ``mujoco``
# to compile the model and read off the kinematic structure, meshes and inertials.
# mujoco ships wheels only for Python >= 3.10; older interpreters fall back to a
# source build (which needs MUJOCO_PATH), so gate the dependency on the floor.
mjcf = [
    "mujoco; python_version >= '3.10'",
]

[dependency-groups]
dev = [
    "robot_descriptions",
    "tqdm",
    "tabulate",
    "tyro",
    "ruff",
    "pyright",
    "pytest",
    "pytest-xdist",
    "xdoctest",
    "coverage",
    "pytest-cov",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robokit = [
    "**/*.c",
    "**/*.cpp",
    "**/*.h",
    "**/*.hpp",
    "**/*.cu",
    "**/*.cuh",
    "**/*.urdf",
    "**/*.yaml",
    "**/*.json",
    "**/*.jsx",
    "**/*.html",
    "**/*.jpg",
]

[tool.ruff]
line-length = 120
extend-exclude = ["ref"]  # untracked reference checkouts; never format or lint them

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors.
    "I",   # isort
    "F",   # Pyflakes rules.
    "PLC", # Pylint convention warnings.
    "PLE", # Pylint errors.
    "PLR", # Pylint refactor recommendations.
    "PLW", # Pylint warnings.
]
ignore = [
    "E731",    # Do not assign a lambda expression, use a def.
    "E741",    # Ambiguous variable name. (l, O, or I)
    "E501",    # Line too long.
    "E721",    # Do not compare types, use `isinstance()`.
    "F722",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004", # Magic value used in comparison.
    "PLR0915", # Too many statements.
    "PLR0913", # Too many arguments.
    "PLR0917", # Too many positional arguments.
    "PLC0414", # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901", # Use falsey strings.
    "PLC0415", # `import` should be at the top-level of a file
    "PLR5501", # Use `elif` instead of `else if`.
    "PLR0911", # Too many return statements.
    "PLR0912", # Too many branches.
    "PLW0603", # Globa statement updates are discouraged.
    "PLW2901", # For loop variable overwritten.
]

[tool.ruff.lint.isort]
known-first-party = ["robokit"]
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = "--cov=robokit --cov-report=term --durations=10"
norecursedirs = ["scripts", ".worktrees", "ref"]
markers = ["torch: requires PyTorch", "slow: long-running; skipped on PRs, run on main/weekly"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
constraint-dependencies = [
    "torch<2.5.0; python_version < '3.9'",
]
conflicts = [
    [
        { extra = "pt-cpu" },
        { extra = "pt-cu118" },
    ],
    [
        { extra = "pt-cpu" },
        { extra = "pt-cu126" },
    ],
    [
        { extra = "pt-cpu" },
        { extra = "pt-cu128" },
    ],
    [
        { extra = "pt-cu118" },
        { extra = "pt-cu126" },
    ],
    [
        { extra = "pt-cu118" },
        { extra = "pt-cu128" },
    ],
    [
        { extra = "pt-cu126" },
        { extra = "pt-cu128" },
    ],
    [
        { extra = "warp-1-8" },
        { extra = "warp-1-10" },
    ],
]

[tool.uv.sources]
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git" }
torch = [
    { index = "pytorch-cu118", extra = "pt-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu126", extra = "pt-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "pt-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "pt-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "examples"]
ignore = ["src/robokit/thirdparty", "examples/humanoid_retarget/calibration"]
reportAttributeAccessIssue = false
reportInvalidTypeForm = false
reportAbstractUsage = false
reportIncompatibleMethodOverride = false
reportOverlappingOverload = false
reportPossiblyUnboundVariable = false
reportOptionalMemberAccess = false

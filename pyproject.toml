[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexrtgt"
version = "0.2.0"
authors = [{ name = "dexrtgt" }]
description = "dexrtgt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "packaging",
    "typing-extensions",
    "jaxtyping",
    "rich",
    "PyYAML",
    "numpy<2",
    "yourdfpy",
    "pin",
    "qpsolvers[daqp]",
    "viser",
    "einops",
    "warp-lang",
    "beartype>=0.19.0",
    "smplx>=0.1.28",
    "natsort>=8.4.0",
    "robot-descriptions>=1.22.0",
]


[project.optional-dependencies]
cpu = ["torch"]
cu126 = ["torch"]
cu128 = [
    "torch",
    "nvidia-nccl-cu12",
]
dev = [
    "robot_descriptions",
    "pandas",
    "tabulate",
    "pin-pink",
    "smplx",
    "opencv-python",
    "ipython",
    "ruff",
    "pyright",
    "pytest",
    "xdoctest",
    "coverage",
    "pytest-cov",
    "pre-commit",
    "tyro",
    "gdown",
    "tabulate>=0.9.0",
    "ipdb>=0.13.13",
    "mujoco",
    "mujoco-python-viewer",
    "matplotlib"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robokit = ["**/*.c", "**/*.cpp", "**/*.h", "**/*.hpp", "**/*.cu", "**/*.cuh", "**/*.urdf", "**/*.yaml", "**/*.json"]

[tool.ruff]
line-length = 120
exclude = ["src/robokit/thirdparty", "thirdparty"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors.
    "I",   # isort
    "F",   # Pyflakes rules.
    "PLC", # Pylint convention warnings.
    "PLE", # Pylint errors.
    "PLR", # Pylint refactor recommendations.
    "PLW", # Pylint warnings.
]
ignore = [
    "E731",    # Do not assign a lambda expression, use a def.
    "E741",    # Ambiguous variable name. (l, O, or I)
    "E501",    # Line too long.
    "E721",    # Do not compare types, use `isinstance()`.
    "F722",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004", # Magic value used in comparison.
    "PLR0915", # Too many statements.
    "PLR0913", # Too many arguments.
    "PLC0414", # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901", # Use falsey strings.
    "PLC0415", # `import` should be at the top-level of a file
    "PLR5501", # Use `elif` instead of `else if`.
    "PLR0911", # Too many return statements.
    "PLR0912", # Too many branches.
    "PLW0603", # Globa statement updates are discouraged.
    "PLW2901", # For loop variable overwritten.
]

[tool.ruff.lint.isort]
known-first-party = ["robokit"]
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = "--cov=robokit --cov-report=term --ignore=thirdparty"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
constraint-dependencies = [
    "pin<3.7.0; python_version < '3.9'",
]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "cu128" }],
    [{ extra = "cu126" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128", marker = "python_version >= '3.9' and (sys_platform == 'linux' or sys_platform == 'win32')" },
    { index = "pytorch-cu126", extra = "cu126", marker = "python_version >= '3.9' and (sys_platform == 'linux' or sys_platform == 'win32')" },
    { index = "pytorch-cpu", extra = "cpu", marker = "python_version >= '3.9' and (sys_platform == 'linux' or sys_platform == 'win32')" },
    { index = "pytorch-cu118", marker = "python_version < '3.9'" },
]

[tool.coverage.run]
omit = ["src/robokit/thirdparty/*"]


[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "examples"]
ignore = ["src/robokit/thirdparty"]
reportAttributeAccessIssue = false
reportInvalidTypeForm = false
reportAbstractUsage = false
reportIncompatibleMethodOverride = false
reportOverlappingOverload = false
reportPossiblyUnboundVariable = false
reportOptionalMemberAccess = false

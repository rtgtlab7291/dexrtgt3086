# SMPL-X to Unitree H1-2 retargeting configuration.
# Quaternions are scalar-first (w, x, y, z).
# Converted from smplx_to_h1_2.json (ik_match_table1).

urdf_path: ../../../assets/robot_description/unitree_h1_2/h1_2_handless.urdf

human_root_name: pelvis
robot_root_name: pelvis
human_height_assumption: 1.66
ground_height: 0.0

# Solver parameters
position_limit_weight: 30.0

# Per-joint smoothness (27 DOFs):
# Joint order: left_leg(6: hip_yaw, hip_pitch, hip_roll, knee, ankle_pitch, ankle_roll),
#              right_leg(6: same), torso(1), left_arm(7: shoulder_pitch/roll/yaw, elbow, wrist_roll/pitch/yaw),
#              right_arm(7: same)
smoothness_weight:
  [25, 20, 25, 45, 10, 10,  # left leg
   25, 20, 25, 45, 10, 10,  # right leg
   100,                      # torso
   35, 25, 15, 13, 5, 5, 5,  # left arm
   35, 25, 15, 13, 5, 5, 5]  # right arm

base_smoothness_weight: 1.5
smoothness_cost_threshold: 100.0
smoothness_min_scale: 0.3

# Per-joint rest weight: high on shoulder_pitch to prevent bifurcation flips
rest_weight:
  [0.5, 0.5, 0.0, 0.0, 0.0, 0.0,  # left leg
   0.5, 0.5, 0.0, 0.0, 0.0, 0.0,  # right leg
   0.0,                              # torso
   15, 5, 0.5, 0.0, 0.0, 0.0, 0.0, # left arm
   15, 5, 0.5, 0.0, 0.0, 0.0, 0.0] # right arm

velocity_limit_weight: 0.2
velocity_limit_dt: 0.03333333
velocity_clamp_scale: 0.8

# Per-joint velocity limits (rad/s) for retargeting; overrides URDF motor limits.
velocity_limit_override:
  [12, 12, 12, 12, 8, 8,    # left leg
   12, 12, 12, 12, 8, 8,    # right leg
   4,                        # torso
   12, 12, 12, 12, 12, 12, 12,  # left arm
   12, 12, 12, 12, 12, 12, 12]  # right arm

stages:
  - {num_seeds: 4, iters: 6, lm_lambda: 1.5}
  - {num_seeds: 1, iters: 3, lm_lambda: 1.5}

scale_table:
  pelvis: 1.1
  spine3: 1.1

  left_hip: 1.1
  right_hip: 1.1
  left_knee: 1.1
  right_knee: 1.1
  left_foot: 1.1
  right_foot: 1.1

  left_shoulder: 1.1
  right_shoulder: 1.1
  left_elbow: 1.1
  right_elbow: 1.1

link_mapping:
  pelvis:
    human_joint: pelvis
    position_weight: 100
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  left_hip_roll_link:
    human_joint: left_hip
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]

  left_knee_link:
    human_joint: left_knee
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  left_ankle_roll_link:
    human_joint: left_foot
    position_weight: 100
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  right_hip_roll_link:
    human_joint: right_hip
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]

  right_knee_link:
    human_joint: right_knee
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  right_ankle_roll_link:
    human_joint: right_foot
    position_weight: 100
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  torso_link:
    human_joint: spine3
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.5, -0.5, -0.5, -0.5]

  left_shoulder_roll_link:
    human_joint: left_shoulder
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.70710678, 0.0, -0.70710678, 0.0]

  left_elbow_link:
    human_joint: left_elbow
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [1.0, 0.0, 0.0, 0.0]

  right_shoulder_roll_link:
    human_joint: right_shoulder
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.0, 0.70710678, 0.0, 0.70710678]

  right_elbow_link:
    human_joint: right_elbow
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [0.0, 0.0, 0.0, -1.0]

# SMPL-X to Fourier GR3 retargeting configuration.
# Quaternions are scalar-first (w, x, y, z).
# Converted from smplx_to_gr3.json (ik_match_table1).

urdf_path: ../../../assets/robot_description/fourier_gr3/basic_urdf/gr3v2_1_1_dummy_hand.urdf

human_root_name: pelvis
robot_root_name: base_link
human_height_assumption: 1.66
ground_height: 0.0

# Solver parameters
position_limit_weight: 30.0

# Per-joint smoothness (31 DOFs):
# Joint order: waist(3: yaw, roll, pitch), head(2: yaw, pitch),
#              right_arm(7: shoulder_pitch/roll/yaw, elbow_pitch, wrist_yaw/pitch/roll),
#              left_arm(7: same),
#              right_leg(6: hip_pitch/roll/yaw, knee_pitch, ankle_pitch/roll),
#              left_leg(6: same)
smoothness_weight:
  [100, 100, 100,              # waist
   50, 50,                     # head
   25, 15, 5, 13, 5, 5, 5,    # right arm
   25, 15, 5, 13, 5, 5, 5,    # left arm
   15, 20, 15, 45, 10, 10,    # right leg
   15, 20, 15, 45, 10, 10]    # left leg

base_smoothness_weight: 1.5
smoothness_cost_threshold: 100.0
smoothness_min_scale: 0.3

# Per-joint rest weight: high on shoulder_pitch to prevent bifurcation flips
rest_weight:
  [0.0, 0.0, 0.0,                    # waist
   1.0, 1.0,                          # head
   15, 5, 0.5, 0.0, 0.0, 0.0, 0.0,  # right arm
   15, 5, 0.5, 0.0, 0.0, 0.0, 0.0,  # left arm
   0.5, 0.5, 0.0, 0.0, 0.0, 0.0,    # right leg
   0.5, 0.5, 0.0, 0.0, 0.0, 0.0]    # left leg

velocity_limit_weight: 0.2
velocity_limit_dt: 0.03333333
velocity_clamp_scale: 0.8

# Per-joint velocity limits (rad/s) for retargeting; overrides URDF motor limits.
velocity_limit_override:
  [4, 4, 4,                        # waist
   8, 8,                           # head
   12, 12, 12, 12, 12, 12, 12,    # right arm
   12, 12, 12, 12, 12, 12, 12,    # left arm
   12, 12, 12, 12, 8, 8,          # right leg
   12, 12, 12, 12, 8, 8]          # left leg

stages:
  - {num_seeds: 4, iters: 6, lm_lambda: 1.5}
  - {num_seeds: 1, iters: 3, lm_lambda: 1.5}


scale_table:
  pelvis: 1.0
  spine3: 1.0

  left_hip: 1.0
  right_hip: 1.0
  left_knee: 1.0
  right_knee: 1.0
  left_foot: 1.0
  right_foot: 1.0

  left_shoulder: 1.0
  right_shoulder: 1.0
  left_elbow: 1.0
  right_elbow: 1.0
  left_wrist: 1.0
  right_wrist: 1.0

link_mapping:
  base_link:
    human_joint: pelvis
    position_weight: 50
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [-0.5, 0.5, 0.5, 0.5]

  left_thigh_roll_link:
    human_joint: left_hip
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [-0.5, 0.5, 0.5, 0.5]

  left_shank_pitch_link:
    human_joint: left_knee
    position_weight: 0
    orientation_weight: 10
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [-0.5, 0.5, 0.5, 0.5]

  left_foot_roll_link:
    human_joint: left_foot
    position_weight: 100
    orientation_weight: 50
    position_offset: [0.0, 0.0, 0.0]
    rotation_offset: [-0.5, 0.5, 0.5, 0.5]

  right_thigh_roll_link:
